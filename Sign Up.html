<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>GoChef - Sign Up</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&amp;family=Karla:wght@400;500&amp;display=swap" rel="stylesheet">

                    "on-secondary-fixed-variant": "#454747",
                    "surface-container": "#1c2029",
                    "on-primary-container": "#590029",
                    "tertiary-fixed-dim": "#ffb0cd",
                    "surface": "#0f131c",
                    "inverse-surface": "#dfe2ef",
                    "secondary-container": "#454747",
                    "tertiary": "#ffb0cd",
                    "on-error-container": "#ffdad6",
                    "surface-variant": "#31353f",
                    "primary-fixed-dim": "#ffb1c6",
                    "primary-fixed": "#ffd9e1",
                    "surface-bright": "#353943",
                    "secondary-fixed": "#e2e2e2",
                    "on-background": "#dfe2ef",
                    "on-secondary-fixed": "#1a1c1c",
                    "on-tertiary-fixed-variant": "#7f2250",
                    "tertiary-container": "#db6c9b",
                    "background": "#0f131c",
                    "on-error": "#690005",
                    "primary": "#ffb1c6",
                    "on-secondary-container": "#b4b5b5",
                    "error": "#ffb4ab",
                    "on-error-container": "#ffdad6",
                    "on-tertiary-container": "#570032",
                    "inverse-primary": "#ba005e",
                    "tertiary-fixed": "#ffd9e4",
                    "inverse-on-surface": "#2c303a",
                    "secondary": "#c6c6c7",
                    "on-secondary": "#2f3131",
                    "surface-tint": "#ffb1c6",
                    "primary-container": "#ff4a90",
                    "surface-dim": "#0f131c",
                    "outline": "#a98890",
                    "surface-container-low": "#181b25",
                    "surface-container-lowest": "#0a0e17",
                    "on-surface": "#dfe2ef",
                    "on-tertiary-fixed": "#3e0021",
                    "error-container": "#93000a",
                    "on-primary-fixed": "#3f001b",
                    "on-primary-fixed-variant": "#8e0046",
                    "surface-container-highest": "#31353f",
                    "surface-container-high": "#262a34",
                    "outline-variant": "#5a4046",
                    "on-tertiary": "#620639",

            },
            "borderRadius": {

                    "lg": "0.5rem",

            "spacing": {

                    "label-mono": ["14px", {"lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "500"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
                    "display-lg-mobile": ["36px", {"lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],

                    "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}]

          },
        },
      }

<style>
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #0f131c;
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .bg-glass {
        background: rgba(28, 32, 41, 0.7);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
      .btn-gradient {
        background: linear-gradient(135deg, #ff4a90 0%, #db6c9b 100%);
      }
      .ghost-border {
        border: 1px solid rgba(226, 189, 197, 0.1);
      }
      .focus-glow:focus-within {
        border-color: rgba(255, 74, 144, 0.4);
        box-shadow: 0 0 10px rgba(255, 74, 144, 0.15);
      }
    </style>
</head>
<body class="text-on-surface min-h-screen flex flex-col font-body-md overflow-x-hidden">
<!-- Top Navigation Shell -->
<header class="fixed top-0 z-50 w-full bg-surface-glass backdrop-blur-xl h-16 flex justify-between items-center px-gutter-mobile border-b border-outline-variant/30">
<button aria-label="Go Back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<span class="font-display-lg-mobile text-display-lg-mobile font-bold text-primary">GoChef</span>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="flex-grow pt-24 pb-stack-lg px-gutter-mobile max-w-lg mx-auto w-full">
<!-- Hero Section -->
<section class="mb-stack-lg">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-stack-xs">Create Account</h1>
<p class="font-body-md text-body-md text-on-surface-variant opacity-80">Join the community of neighborhood chefs and foodies.</p>
</section>
<!-- Social Sign Up -->
<div class="flex flex-col gap-stack-sm mb-stack-lg">
<button class="w-full h-14 rounded-xl ghost-border bg-glass flex items-center justify-center gap-3 transition-transform active:scale-95">
<svg class="w-5 h-5" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="font-label-sm text-label-sm uppercase tracking-wider text-on-surface">Continue with Google</span>
</button>
<button class="w-full h-14 rounded-xl ghost-border bg-glass flex items-center justify-center gap-3 transition-transform active:scale-95">
<svg class="w-5 h-5 fill-on-surface" viewBox="0 0 24 24">
<path d="M17.05 20.28c-.98.95-2.05 1.88-3.08 1.88-1.07 0-1.48-.65-2.68-.65-1.2 0-1.63.63-2.68.65-1.05.02-2.28-1.03-3.26-1.98C3.35 18.18 1.5 14.33 1.5 10.88c0-3.35 2.17-5.13 4.25-5.13 1.1 0 2.12.77 2.8.77.67 0 1.93-.9 3.2-.9 1.33 0 2.65.6 3.4 1.65-2.73 1.63-2.3 5.35.43 6.45-.63 1.83-1.6 3.6-2.53 4.56zM12.03 5.03c-.1-.95.42-1.9 1.05-2.65.65-.77 1.63-1.32 2.53-1.32.1.95-.42 1.82-1.07 2.63-.65.8-1.6 1.4-2.51 1.34z"></path>
</svg>
<span class="font-label-sm text-label-sm uppercase tracking-wider text-on-surface">Continue with Apple</span>
</button>
</div>
<div class="flex items-center gap-4 mb-stack-lg">
<div class="h-px flex-grow bg-outline-variant opacity-30"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">or</span>
<div class="h-px flex-grow bg-outline-variant opacity-30"></div>
</div>
<!-- Form Fields -->
<form class="space-y-stack-sm" id="signup-form" onsubmit="event.preventDefault()">
<!-- Full Name -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant px-1" for="full-name">Full Name</label>
<div class="relative group focus-glow rounded-lg ghost-border bg-surface-container-low transition-all">
<input class="w-full bg-transparent border-none focus:ring-0 text-on-surface py-4 px-4 font-body-md placeholder:text-outline-variant/60" id="full-name" placeholder="E.g. Elena Rossi" type="text">
</div>
</div>
<!-- Email Address -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant px-1" for="email">Email Address</label>
<div class="relative group focus-glow rounded-lg ghost-border bg-surface-container-low transition-all">
<input class="w-full bg-transparent border-none focus:ring-0 text-on-surface py-4 px-4 font-body-md placeholder:text-outline-variant/60" id="email" placeholder="chef@example.com" type="email">
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant px-1" for="password">Password</label>
<div class="relative group focus-glow rounded-lg ghost-border bg-surface-container-low transition-all flex items-center">
<input class="flex-grow bg-transparent border-none focus:ring-0 text-on-surface py-4 px-4 font-body-md placeholder:text-outline-variant/60" id="password" placeholder="At least 8 characters" type="password">
<button class="px-4 text-on-surface-variant hover:text-primary transition-colors" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined" id="password-icon">visibility</span>
</button>
</div>
</div>
<!-- Primary Action -->
<button class="w-full h-16 mt-stack-md rounded-xl btn-gradient flex items-center justify-center font-headline-md text-headline-md font-bold text-white shadow-lg shadow-magenta-gloss/20 hover:opacity-90 active:scale-98 transition-all" type="submit">
                Sign Up
            </button>
</form>
<!-- Footer Links -->
<div class="mt-stack-lg text-center">
<p class="font-body-md text-on-surface-variant">
                Already have an account? 
                <a class="text-primary font-bold hover:underline ml-1" href="#">Log In</a>
</p>
</div>
<!-- Privacy Policy -->
<div class="mt-16 text-center">
<p class="font-label-sm text-label-sm text-on-surface-variant/60 leading-relaxed">
                By signing up, you agree to our <br>
<a class="underline hover:text-on-surface-variant" href="#">Terms of Service</a> and <a class="underline hover:text-on-surface-variant" href="#">Privacy Policy</a>.
            </p>
</div>
</main>
<!-- Contextual Decorative Element (Soft Gradient Glow) -->
<div class="fixed -bottom-32 -left-32 w-96 h-96 bg-primary-container/10 rounded-full blur-[120px] pointer-events-none -z-10"></div>
<div class="fixed -top-32 -right-32 w-96 h-96 bg-secondary-container/10 rounded-full blur-[120px] pointer-events-none -z-10"></div>
<script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const icon = document.getElementById('password-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        // Add simple micro-interaction to input containers
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.closest('.group').style.borderColor = 'rgba(255, 177, 198, 0.4)';
            });
            input.addEventListener('blur', () => {
                input.closest('.group').style.borderColor = '';
            });
        });
    </script>
</body></html>
