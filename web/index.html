<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="google-signin-client_id" content="1055253793767-as9i19kkmka2ootv8rublt7qvo31ovrb.apps.googleusercontent.com">
  <meta name="description" content="GoChef - Urban Gourmet Marketplace">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GoChef">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GoChef Premium</title>
  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/croppie/2.6.5/croppie.css" />
  <style>
    body {
      background-color: #0F172A;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .logo-bounce {
      width: 180px;
      height: 180px;
      object-fit: contain;
      margin-bottom: 20px;
      animation: bounce 2s infinite ease-in-out;
      filter: drop-shadow(0 10px 25px rgba(235, 30, 140, 0.35));
    }
    .loading-text {
      color: #FFFFFF;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      animation: pulse 1.5s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-12px) scale(1.04); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }
  </style>
</head>
<body>
  <div class="loading-container" id="app-loader">
    <img src="gochef_logo.png?v=3" alt="GoChef Logo" class="logo-bounce" />
    <div class="loading-text">Preparing GoChef...</div>
  </div>
  <script>
    window.onerror = function(msg, url, line, col, error) {
      // Ignore third-party browser extension errors
      if (url && (url.includes('chrome-extension://') || url.includes('moz-extension://') || url.includes('safari-extension://'))) {
        return;
      }
      var msgStr = (msg || '').toString();
      if (msgStr.includes('extension') || msgStr.includes('Talisman') || msgStr.includes('MetaMask')) {
        return;
      }
      console.error('GoChef Error:', msg, url, line, col, error);
    };
    window.addEventListener('unhandledrejection', function(e) {
      var reason = e.reason ? (e.reason.message || e.reason.stack || e.reason.toString()) : '';
      // Ignore third-party browser extensions (Talisman, MetaMask, Phantom, etc.)
      if (
        reason.includes('Talisman') ||
        reason.includes('extension') ||
        reason.includes('MetaMask') ||
        reason.includes('chrome-extension://') ||
        reason.includes('moz-extension://') ||
        (e.reason && e.reason.stack && (e.reason.stack.includes('chrome-extension://') || e.reason.stack.includes('moz-extension://')))
      ) {
        console.warn('Ignored browser extension promise rejection:', reason);
        return;
      }
      console.error('GoChef Promise Error:', reason);
    });
    // Safety fallback: hide loader after 8 seconds no matter what
    setTimeout(function() {
      var loader = document.getElementById('app-loader');
      if (loader) {
        loader.style.transition = 'opacity 0.5s ease';
        loader.style.opacity = '0';
        setTimeout(function() { loader.remove(); }, 600);
      }
    }, 8000);
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/croppie/2.6.5/croppie.min.js"></script>

  <!-- GoChef Web Audio: synthesized notification sounds, no audio files needed -->
  <script>
    let _goChefAudioCtx = null;

    function _getCtx() {
      if (!_goChefAudioCtx) {
        _goChefAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      // Resume if suspended (browser policy)
      if (_goChefAudioCtx.state === 'suspended') {
        _goChefAudioCtx.resume();
      }
      return _goChefAudioCtx;
    }

    function _playTone(freq, startTime, duration, gainVal, type) {
      const ctx = _getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, startTime);
      gain.gain.setValueAtTime(gainVal, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
      osc.start(startTime);
      osc.stop(startTime + duration);
    }

    // Prominent multi-tone loud chime for incoming customer orders (Ding-Dong-Ding! 🛎️)
    window.goChefPlayOrder = function() {
      try {
        const ctx = _getCtx();
        const now = ctx.currentTime;
        // Ascending harmonic chime sequence (C5 -> E5 -> G5 -> C6)
        _playTone(523.25, now,        0.18, 0.40, 'triangle');
        _playTone(659.25, now + 0.12, 0.18, 0.40, 'triangle');
        _playTone(783.99, now + 0.24, 0.18, 0.40, 'triangle');
        _playTone(1046.5, now + 0.36, 0.40, 0.45, 'sine');
        
        // Second chime echo for restaurant kitchen clarity
        _playTone(783.99, now + 0.65, 0.16, 0.30, 'triangle');
        _playTone(1046.5, now + 0.77, 0.50, 0.45, 'sine');
      } catch(e) { console.warn('GoChef order audio error:', e); }
    };

    // Two-tone pleasant ding for notifications
    window.goChefPlayNotification = function() {
      try {
        const ctx = _getCtx();
        const now = ctx.currentTime;
        _playTone(880, now,       0.18, 0.22, 'sine');
        _playTone(1100, now + 0.12, 0.22, 0.18, 'sine');
      } catch(e) { console.warn('GoChef audio error:', e); }
    };

    // Light single ping for chat messages
    window.goChefPlayMessage = function() {
      try {
        const ctx = _getCtx();
        const now = ctx.currentTime;
        _playTone(1200, now, 0.14, 0.15, 'sine');
      } catch(e) { console.warn('GoChef audio error:', e); }
    };

    // Unlock audio context on first user interaction
    document.addEventListener('click', function() {
      _getCtx();
    }, { once: false });
    document.addEventListener('touchstart', function() {
      _getCtx();
    }, { once: false });

    // HTML5 Real GPS Geolocation for Web
    window.goChefGetLocation = function(successCallback, errorCallback) {
      if (!navigator.geolocation) {
        if (errorCallback) errorCallback("Geolocation is not supported by this browser.");
        return;
      }
      navigator.geolocation.getCurrentPosition(
        function(pos) {
          if (successCallback) {
            successCallback(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy || 0);
          }
        },
        function(err) {
          if (errorCallback) {
            let msg = "Unable to retrieve location";
            if (err.code === 1) msg = "Location permission denied";
            else if (err.code === 2) msg = "Location position unavailable";
            else if (err.code === 3) msg = "Location request timed out";
            errorCallback(msg);
          }
        },
        {
          enableHighAccuracy: true,
          timeout: 12000,
          maximumAge: 30000
        }
      );
    };
  </script>

  <script>
    const s = document.createElement('script');
    s.src = 'flutter_bootstrap.js?v=' + Date.now();
    s.async = true;
    document.body.appendChild(s);
  </script>
</body>
</html>
