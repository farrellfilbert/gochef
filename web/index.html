<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="google-signin-client_id" content="1055253793767-as9i19kkmka2ootv8rublt7qvo31ovrb.apps.googleusercontent.com">
  <meta name="description" content="GoChef - Urban Gourmet Marketplace">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GoChef">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GoChef Premium</title>
  <link rel="manifest" href="manifest.json">

  <!-- Cropper CSS deferred so it doesn't block Flutter init -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.css" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/croppie/2.6.5/croppie.css" media="print" onload="this.media='all'">

  <style>
    body {
      background-color: #0F172A;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .loading-logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      margin-bottom: 20px;
      animation: fadeIn 0.5s ease-in;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 64, 129, 0.2);
      border-radius: 50%;
      border-top-color: #FF4081;
      animation: spin 0.8s ease-in-out infinite;
      margin-bottom: 16px;
    }
    .loading-text {
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1px;
      opacity: 0.7;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>

  <!-- Flutter bootstrap loaded ASAP -->
  <script src="flutter_bootstrap.js" async></script>
</head>
<body>
  <div class="loading-container" id="app-loader">
    <img class="loading-logo" src="assets/assets/images/GoCheflogo.png" onerror="this.style.display='none'">
    <div class="spinner"></div>
    <div class="loading-text">GoChef</div>
  </div>

  <!-- Cropper scripts deferred — won't block app startup -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/croppie/2.6.5/croppie.min.js" defer></script>
</body>
</html>
