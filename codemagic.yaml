workflows:
  ios-release:
    name: GoChef iOS Release & App Store Connect
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: "GoChef Integration"
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.app.gochef"
        P12_PASSWORD: "123456"
    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          keychain initialize
          keychain add-certificates --certificate ios_distribution.p12 --certificate-password "$P12_PASSWORD"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp GoChef_AppStore_Profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/"
          xcode-project use-profiles --warn-only
      - name: Get Flutter packages & install CocoaPods
        script: |
          flutter pub get
          cd ios && pod install
          sed -i '' 's/@import google_sign_in_ios;/\/\/@import google_sign_in_ios;/g' Runner/GeneratedPluginRegistrant.m || true
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
