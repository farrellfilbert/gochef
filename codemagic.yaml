workflows:
  ios-release:
    name: GoChef iOS Release & App Store Connect
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: "GoChef Integration"
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.app.gochef"
        P12_PASSWORD: "123456"
    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          keychain initialize
          keychain add-certificates --certificate ios_distribution.p12 --certificate-password "$P12_PASSWORD"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp GoChef_AppStore_Profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/"
          xcode-project use-profiles --warn-only
      - name: Flutter build ipa & export
        script: |
          flutter pub get
          BUILD_NUM=${BUILD_NUMBER:-1}
          FINAL_BUILD_NUMBER=$((BUILD_NUM + 30))
          echo "Building iOS IPA with build number: $FINAL_BUILD_NUMBER"
          flutter build ipa --release --no-codesign --build-name=2.0.1 --build-number=$FINAL_BUILD_NUMBER
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist /Users/builder/export_options.plist \
            -exportPath build/ios/ipa
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
