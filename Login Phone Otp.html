<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>GoChef - Verify Phone</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&amp;family=Karla:wght@400;500&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@100..900&amp;family=Montserrat:wght@100..900&amp;display=swap" rel="stylesheet">
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(28, 32, 41, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .otp-input:focus {
            outline: none;
            border-color: #ff4a90;
            box-shadow: 0 0 15px rgba(255, 74, 144, 0.3);
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        .neon-glow {
            animation: pulse-glow 3s infinite ease-in-out;
        }
        .keypad-button:active {
            transform: scale(0.9);
            background-color: rgba(255, 255, 255, 0.1);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed": "#1a1c1c",
                        "error": "#ffb4ab",
                        "surface-container-highest": "#31353f",
                        "on-primary-fixed": "#3f001b",
                        "inverse-primary": "#ba005e",
                        "secondary-fixed": "#e2e2e2",
                        "primary-fixed": "#ffd9e1",
                        "surface-container-lowest": "#0a0e17",
                        "primary-container": "#ff4a90",
                        "surface-container-low": "#181b25",
                        "tertiary-container": "#db6c9b",
                        "on-error": "#690005",
                        "outline-variant": "#5a4046",
                        "surface-dim": "#0f131c",
                        "on-secondary": "#2f3131",
                        "surface": "#0f131c",
                        "on-secondary-fixed-variant": "#454747",
                        "surface-variant": "#31353f",
                        "on-background": "#dfe2ef",
                        "surface-container": "#1c2029",
                        "inverse-on-surface": "#2c303a",
                        "on-surface": "#dfe2ef",
                        "on-surface-variant": "#e2bdc5",
                        "on-secondary-container": "#b4b5b5",
                        "on-primary-container": "#590029",
                        "primary-fixed-dim": "#ffb1c6",
                        "inverse-surface": "#dfe2ef",
                        "surface-tint": "#ffb1c6",
                        "secondary-container": "#454747",
                        "outline": "#a98890",
                        "tertiary": "#ffb0cd",
                        "secondary": "#c6c6c7",
                        "on-tertiary": "#620639",
                        "tertiary-fixed-dim": "#ffb0cd",
                        "on-primary": "#650030",
                        "secondary-fixed-dim": "#c6c6c7",
                        "on-error-container": "#ffdad6",
                        "surface-container-high": "#262a34",
                        "primary": "#ffb1c6",
                        "surface-bright": "#353943",
                        "on-tertiary-container": "#570032",
                        "tertiary-fixed": "#ffd9e4",
                        "background": "#0f131c",
                        "on-tertiary-fixed": "#3e0021",
                        "on-primary-fixed-variant": "#8e0046",
                        "error-container": "#93000a",
                        "on-tertiary-fixed-variant": "#7f2250"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-lg": "48px",
                        "gutter-mobile": "20px",
                        "baseline": "8px",
                        "stack-sm": "12px",
                        "stack-md": "24px",
                        "stack-xs": "4px",
                        "margin-desktop": "64px"
                    },
                    "fontFamily": {
                        "headline-md": ["Montserrat"],
                        "label-mono": ["Karla"],
                        "display-lg": ["Montserrat"],
                        "body-md": ["Karla"],
                        "headline-lg": ["Montserrat"],
                        "display-lg-mobile": ["Montserrat"],
                        "body-lg": ["Karla"],
                        "label-sm": ["Karla"],
                        "headline-lg-mobile": ["Montserrat"]
                    },
                    "fontSize": {
                        "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "label-mono": ["14px", {"lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "500"}],
                        "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
                        "display-lg-mobile": ["36px", {"lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500"}],
                        "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}]
                    }
                },
            },
        }
    </script>
</head>
<body class="bg-surface-container-lowest text-on-surface font-body-md selection:bg-primary/30">
<main class="relative min-h-screen flex flex-col max-w-md mx-auto overflow-hidden">
<!-- Atmospheric Background Shaders/Glows -->
<div class="absolute top-0 left-0 w-full h-full pointer-events-none z-0">
<div class="absolute -top-24 -left-24 w-64 h-64 bg-primary/10 rounded-full blur-[100px] neon-glow"></div>
<div class="absolute top-1/2 -right-32 w-80 h-80 bg-tertiary/5 rounded-full blur-[120px] neon-glow"></div>
</div>
<!-- Header Shell (Supressed Nav, focus on Back button) -->
<header class="relative z-10 flex items-center justify-between px-gutter-mobile h-16 w-full">
<button class="flex items-center justify-center w-10 h-10 rounded-full glass-panel text-on-surface hover:bg-surface-variant/50 transition-colors active:scale-90" onclick="history.back()">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="font-headline-md text-headline-md font-bold tracking-tight text-primary">GoChef</div>
<div class="w-10"></div> <!-- Spacer for center alignment -->
</header>
<!-- Main Content Canvas -->
<section class="relative z-10 flex-grow px-gutter-mobile pt-stack-lg flex flex-col">
<!-- Typography Section -->
<div class="mb-stack-lg">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile mb-stack-xs text-on-surface">Verify Phone</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Enter the 4-digit code sent to <span class="text-on-surface font-semibold">+1 (555) 000-0000</span></p>
</div>
<!-- OTP Inputs -->
<div class="flex justify-between gap-4 mb-stack-lg">
<input autofocus="" class="otp-input w-16 h-20 text-center text-3xl font-bold font-headline-md rounded-xl glass-panel text-on-surface border-outline-variant/30 transition-all focus:border-primary-container" id="otp-1" maxlength="1" type="text">
<input class="otp-input w-16 h-20 text-center text-3xl font-bold font-headline-md rounded-xl glass-panel text-on-surface border-outline-variant/30 transition-all focus:border-primary-container" id="otp-2" maxlength="1" type="text">
<input class="otp-input w-16 h-20 text-center text-3xl font-bold font-headline-md rounded-xl glass-panel text-on-surface border-outline-variant/30 transition-all focus:border-primary-container" id="otp-3" maxlength="1" type="text">
<input class="otp-input w-16 h-20 text-center text-3xl font-bold font-headline-md rounded-xl glass-panel text-on-surface border-outline-variant/30 transition-all focus:border-primary-container" id="otp-4" maxlength="1" type="text">
</div>
<!-- Resend Timer -->
<div class="flex justify-center mb-stack-lg">
<p class="text-on-surface-variant font-label-sm text-label-sm">
                    Resend code in <span class="text-primary font-bold" id="timer">0:00</span>
</p>
</div>
<!-- CTA Button -->
<button class="w-full h-14 rounded-full bg-gradient-to-r from-primary-container to-tertiary-container text-on-primary-container font-headline-md text-headline-md font-bold shadow-[0_0_20px_rgba(255,74,144,0.4)] active:scale-95 transition-all mb-stack-lg">
                Verify &amp; Continue
            </button>
<!-- Custom Numeric Keypad -->
<div class="mt-auto pb-gutter-mobile grid grid-cols-3 gap-y-4 gap-x-8">
<button class="keypad-button h-16 flex items-center justify-center font-headline-lg text-headline-lg-mobile text-on-surface transition-transform" onclick="addDigit(1)">1</button>
<button class="keypad-button h-16 flex items-center justify-center font-headline-lg text-headline-lg-mobile text-on-surface transition-transform" onclick="addDigit(2)">2</button>
<button class="keypad-button h-16 flex items-center justify-center font-headline-lg text-headline-lg-mobile text-on-surface transition-transform" onclick="addDigit(3)">3</button>
<button class="keypad-button h-16 flex items-center justify-center font-headline-lg text-headline-lg-mobile text-on-surface transition-transform" onclick="addDigit(4)">4</button>
<button class="keypad-button h-16 flex items-center justify-center font-headline-lg text-headline-lg-mobile text-on-surface transition-transform" onclick="addDigit(5)">5</button>
<button class="keypad-button h-16 flex items-center justify-center font-headline-lg text-headline-lg-mobile text-on-surface transition-transform" onclick="addDigit(6)">6</button>
<button class="keypad-button h-16 flex items-center justify-center font-headline-lg text-headline-lg-mobile text-on-surface transition-transform" onclick="addDigit(7)">7</button>
<button class="keypad-button h-16 flex items-center justify-center font-headline-lg text-headline-lg-mobile text-on-surface transition-transform" onclick="addDigit(8)">8</button>
<button class="keypad-button h-16 flex items-center justify-center font-headline-lg text-headline-lg-mobile text-on-surface transition-transform" onclick="addDigit(9)">9</button>
<button class="keypad-button h-16 flex items-center justify-center font-headline-lg text-headline-lg-mobile text-on-surface transition-transform opacity-0 pointer-events-none">.</button>
<button class="keypad-button h-16 flex items-center justify-center font-headline-lg text-headline-lg-mobile text-on-surface transition-transform" onclick="addDigit(0)">0</button>
<button class="keypad-button h-16 flex items-center justify-center text-on-surface transition-transform" onclick="removeDigit()">
<span class="material-symbols-outlined text-3xl" data-icon="backspace">backspace</span>
</button>
</div>
</section>
</main>
<script>
        // Simple Input Auto-focus Logic
        const inputs = document.querySelectorAll('.otp-input');
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // Virtual Keypad Helper Functions
        function addDigit(digit) {
            const firstEmptyInput = Array.from(inputs).find(input => !input.value);
            if (firstEmptyInput) {
                firstEmptyInput.value = digit;
                const nextInput = firstEmptyInput.nextElementSibling;
                if (nextInput && nextInput.classList.contains('otp-input')) {
                    nextInput.focus();
                }
            }
        }

        function removeDigit() {
            const filledInputs = Array.from(inputs).filter(input => input.value);
            if (filledInputs.length > 0) {
                const lastFilled = filledInputs[filledInputs.length - 1];
                lastFilled.value = '';
                lastFilled.focus();
            }
        }

        // Simple Countdown Timer
        let time = 45;
        const timerElement = document.getElementById('timer');
        const interval = setInterval(() => {
            time--;
            const mins = Math.floor(time / 60);
            const secs = time % 60;
            timerElement.textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            if (time <= 0) clearInterval(interval);
        }, 1000);

        // Micro-interaction for primary button
        const verifyBtn = document.querySelector('button.bg-gradient-to-r');
        verifyBtn.addEventListener('click', () => {
            verifyBtn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span>';
            setTimeout(() => {
                verifyBtn.innerHTML = '<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span> Verified';
                verifyBtn.classList.replace('from-primary-container', 'from-emerald-500');
                verifyBtn.classList.replace('to-tertiary-container', 'to-teal-500');
            }, 1200);
        });
    </script>
</body></html>
