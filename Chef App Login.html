<body class="font-body-md text-body-md overflow-x-hidden selection:bg-primary/30">

</div>
</div>
<!-- Main Content Canvas -->
<main class="relative z-20 flex flex-col items-center justify-center min-h-screen px-gutter-mobile py-stack-lg">
<!-- Brand Identity -->
<div class="mb-stack-lg animate-in fade-in slide-in-from-top-4 duration-700">
<h1 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg font-bold text-primary tracking-tight">
                GoChef
            </h1>
</div>
<!-- Login Container -->
<div class="w-full max-w-md glass-panel p-8 rounded-xl border border-outline-variant/20 shadow-2xl animate-in fade-in zoom-in-95 duration-500 delay-100">
<!-- Header Section -->
<div class="text-center mb-stack-md">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-md md:text-headline-md text-on-surface mb-2">
                    Chef Portal
                </h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mx-auto">
                    Manage your kitchen, track orders, and grow your brand.
                </p>
</div>
<!-- Login Form -->
<form action="#" class="space-y-stack-md" method="POST" onsubmit="return false;">
<!-- Email/Phone Input -->
<div class="space-y-stack-xs group">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1 transition-colors group-focus-within:text-primary" for="identity">
                        Email or Phone Number
                    </label>
<div class="relative input-glow transition-all duration-300 rounded-lg border border-outline-variant/30 bg-surface-container-low focus-within:bg-surface-container">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">person</span>
<input class="w-full bg-transparent border-none focus:ring-0 pl-12 pr-4 py-3.5 text-on-surface font-body-md placeholder:text-on-surface-variant/40" id="identity" placeholder="chef@urbangourmet.com" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-stack-xs group">
<div class="flex justify-between items-center ml-1">
<label class="font-label-sm text-label-sm text-on-surface-variant transition-colors group-focus-within:text-primary" for="password">
                            Password
                        </label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-fixed transition-colors" href="#">
                            Forgot Password?
                        </a>
</div>
<div class="relative input-glow transition-all duration-300 rounded-lg border border-outline-variant/30 bg-surface-container-low focus-within:bg-surface-container">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
<input class="w-full bg-transparent border-none focus:ring-0 pl-12 pr-12 py-3.5 text-on-surface font-body-md placeholder:text-on-surface-variant/40" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Sign In Button -->
<button class="w-full primary-gradient text-on-primary-fixed font-headline-md text-headline-md py-4 rounded-full shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-[0.98] transition-all duration-300 mt-4" type="submit">
                    Sign In
                </button>
</form>
<!-- Divider -->
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/30"></div>
</div>
<div class="relative flex justify-center text-xs uppercase">
<span class="bg-surface-container-low px-4 text-on-surface-variant font-label-sm tracking-widest">Or continue with</span>
</div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-3 glass-panel border border-outline-variant/20 py-3 rounded-xl hover:bg-surface-container-highest transition-colors active:scale-[0.98] duration-200">
<svg class="w-5 h-5" fill="currentColor" viewbox="0 0 24 24">

</svg>
<span class="font-label-sm">Apple</span>
</button>
<button class="flex items-center justify-center gap-3 glass-panel border border-outline-variant/20 py-3 rounded-xl hover:bg-surface-container-highest transition-colors active:scale-[0.98] duration-200">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="font-label-sm">Google</span>

<div class="mt-stack-lg animate-in fade-in slide-in-from-bottom-4 duration-700 delay-200">
<p class="font-body-md text-on-surface-variant">
                New to the platform? 
                <a class="text-primary font-bold hover:text-primary-fixed transition-colors ml-1" href="#">
                    Register as a Chef
                </a>
</p>
</div>
<!-- Footer Decor -->
<div class="mt-auto pt-stack-lg text-center opacity-40">
<p class="font-label-sm text-label-sm tracking-widest uppercase">
                © 2024 GoChef Urban Gourmet Collective
            </p>
</div>
</main>
<!-- Micro-interaction Scripts -->
<script>
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('border-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('border-primary');
            });
        });

        // Simple visibility toggle logic
        const toggleBtn = document.querySelector('button[type="button"]');
        const passInput = document.querySelector('#password');
        toggleBtn.addEventListener('click', () => {
            const type = passInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passInput.setAttribute('type', type);
            toggleBtn.querySelector('span').textContent = type === 'password' ? 'visibility' : 'visibility_off';
        });
    </script>
</body></html>
